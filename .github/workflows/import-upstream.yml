name: Import Fieldwatch snapshot

on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-fieldwatch
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'dbrckk/Watch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import complete pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          upstream_dir="$(mktemp -d)"
          git -C "$upstream_dir" init --quiet
          git -C "$upstream_dir" remote add origin https://github.com/OffGridPete/Fieldwatch.git
          git -C "$upstream_dir" fetch --quiet --depth=1 origin 844ace8c5c787695977b2c4857e06533603aba95
          git -C "$upstream_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$upstream_dir" rev-parse HEAD)" = "844ace8c5c787695977b2c4857e06533603aba95"
          rsync -a --exclude='.git' --exclude='.github/workflows/' "$upstream_dir/" "$GITHUB_WORKSPACE/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already imported.'
            exit 0
          fi
          git commit -m 'chore: import complete Fieldwatch source at 844ace8'
          git push origin HEAD:main
