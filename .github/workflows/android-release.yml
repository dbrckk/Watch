name: Signed Watch Android release

# Trigger manually from the main branch after configuring repository secrets.
# Never publish a new keystore from CI: app updates need the SAME publisher key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag matching app/build.gradle.kts (e.g. v1.1.26-watch.2)"
        required: true
        default: "v1.1.26-watch.2"
        type: string

permissions:
  contents: write

concurrency:
  group: signed-watch-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign and publish APK
    if: github.repository == 'dbrckk/Watch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify branch and version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Signed releases must be dispatched from main."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-watch\.[0-9]+$ ]]; then
            echo "::error::Invalid release version."
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          if ! grep -Fq "versionName = \"$expected\"" app/build.gradle.kts; then
            echo "::error::The release tag must match the Gradle versionName."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "::error::This release tag already exists. Bump versionCode and versionName for a new release."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent publisher key (secrets never printed)
        shell: bash
        env:
          WATCH_KEYSTORE_BASE64: ${{ secrets.WATCH_KEYSTORE_BASE64 }}
          WATCH_STORE_PASSWORD: ${{ secrets.WATCH_STORE_PASSWORD }}
          WATCH_KEY_ALIAS: ${{ secrets.WATCH_KEY_ALIAS }}
          WATCH_KEY_PASSWORD: ${{ secrets.WATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in WATCH_KEYSTORE_BASE64 WATCH_STORE_PASSWORD WATCH_KEY_ALIAS WATCH_KEY_PASSWORD; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Missing $var. Configure all four repository Actions secrets."
              exit 1
            fi
          done
          umask 077
          key_file="$RUNNER_TEMP/watch-release-keystore.jks"
          printf '%s' "$WATCH_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          echo "WATCH_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
          # Password values are provided as encrypted environment secrets directly
          # in the Gradle build step; never write them into the Git repository.

      - name: Run tests and assemble optimized signed release
        shell: bash
        env:
          WATCH_STORE_PASSWORD: ${{ secrets.WATCH_STORE_PASSWORD }}
          WATCH_KEY_ALIAS: ${{ secrets.WATCH_KEY_ALIAS }}
          WATCH_KEY_PASSWORD: ${{ secrets.WATCH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Verify APK certificate, package and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          package="$("$tools/aapt" dump badging "$apk" | head -1)"
          echo "$package"
          [[ "$package" == *"name='app.watch.fieldwatch'"* ]] || {
            echo "::error::Unexpected applicationId in signed release."
            exit 1
          }
          release_dir="$RUNNER_TEMP/watch-release"
          mkdir -p "$release_dir"
          cp "$apk" "$release_dir/Watch-Fieldwatch-${RELEASE_TAG}.apk"
          (
            cd "$release_dir"
            sha256sum "Watch-Fieldwatch-${RELEASE_TAG}.apk" > SHA256SUMS.txt
          )
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Reject incompatible publisher identity or Android version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-android-release.sh \
            "$RELEASE_DIR/Watch-Fieldwatch-${RELEASE_TAG}.apk" \
            "$RELEASE_TAG" \
            "$ANDROID_HOME/build-tools/35.0.0"

      - name: Create public release with immutable signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Unofficial Watch Fieldwatch fork of [OffGridPete/Fieldwatch](https://github.com/OffGridPete/Fieldwatch), MIT licensed (see LICENSE and NOTICE).

          - Android applicationId: app.watch.fieldwatch (independent of official Fieldwatch).
          - Signed using the Watch publisher key stored in GitHub Actions secrets.
          - Download the APK attached to this release. SHA256SUMS.txt verifies integrity.
          - Updates without data loss require the SAME signing key, package ID, and a higher versionCode.
          - APKs previously installed from CI debug artifacts use another signing key. Export important logs/settings before uninstalling such a build; installing this release over it will be rejected by Android.
          - Contains an explicit Android share action for the locally processing Watch web console.
          EOF
          printf '\nSigning certificate SHA-256: `%s`\nAndroid versionCode: `%s`\n' \
            "$WATCH_RELEASE_CERT_SHA256" "$WATCH_RELEASE_VERSION_CODE" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_DIR/Watch-Fieldwatch-${RELEASE_TAG}.apk" \
            "$RELEASE_DIR/SHA256SUMS.txt" \
            --title "Watch Fieldwatch $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest
