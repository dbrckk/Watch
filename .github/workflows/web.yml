name: Web checks

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check web/app.mjs
          node --check web/core.mjs
          node --check web/import-processor.mjs
          node --check web/import-worker.mjs
          node --check web/sw.js
      - name: Check Fieldwatch import logic
        run: node --test web/tests/*.test.mjs
      - name: Test signed Android upgrade compatibility (offline mocks)
        run: bash scripts/tests/verify-android-release.sh
      - name: Verify required static files
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/import-processor.mjs
          test -s web/import-worker.mjs
          test -s web/manifest.webmanifest
          test -s web/icon.svg


  browser:
    name: Chromium Android-size end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned test browser driver (no production dependencies)
        run: npm --prefix web/e2e install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify Chrome availability
        shell: bash
        run: |
          set -euo pipefail
          which google-chrome || which chromium || which chromium-browser
      - name: Exercise real offline PWA, worker, privacy and sharing in Chromium
        shell: bash
        run: |
          set -euo pipefail
          export WATCH_CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node web/e2e/smoke.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watch-browser-smoke-failure
          path: web/e2e/artifacts/
          if-no-files-found: ignore
