name: Web checks

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check web/app.mjs
          node --check web/core.mjs
          node --check web/import-processor.mjs
          node --check web/import-worker.mjs
          node --check web/sw.js
      - name: Check Fieldwatch import logic
        run: node --test web/tests/*.test.mjs
      - name: Verify required static files
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/import-processor.mjs
          test -s web/import-worker.mjs
          test -s web/manifest.webmanifest
          test -s web/icon.svg

